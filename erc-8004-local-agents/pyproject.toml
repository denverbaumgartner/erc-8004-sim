[project]
name = "erc-8004-local-agents"
version = "0.1.0"
description = ""
authors = [
    {name = "denver",email = "denver@semiotic.ai"}
]
readme = "README.md"
requires-python = ">=3.13,<4"

[tool.poetry]
name = "erc-8004-local-agents"
version = "0.1.0"
description = ""
authors = ["denver <denver@semiotic.ai>"]
readme = "README.md"
packages = [{include = "erc_8004_local_agents", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
erc-8004-py = { path = "../erc-8004-py", develop = true }
a2a-sdk = { version = ">=0.3.9,<0.4.0", extras = ["all"] }
uvicorn = ">=0.37.0,<0.38.0"
python-dotenv = ">=1.1.1,<2.0.0"
pydantic = ">=2.12.3,<3.0.0"
pyyaml = ">=6.0.3,<7.0.0"
eth-tester = "^0.13.0b1"
web3 = {extras = ["tester"], version = "^7.14.0"}
dspy = "^3.0.3"
polars = "^1.35.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-testmon = "^2.1.3"
black = "^25.9.0"
docformatter = "^1.7.7"
isort = "^7.0.0"
flake8 = "^7.3.0"
pyright = "^1.1.406"
pytest-asyncio = "^1.2.0"
textual = "^6.5.0"
httpx = "^0.28.1"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
